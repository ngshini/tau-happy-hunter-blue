<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY HUNTER — Giám sát hành trình</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#0a2e52;
    font-family:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,monospace; }
  #scene { position:fixed; inset:0; display:block; cursor:grab; }
  #scene:active { cursor:grabbing; }
  .hud { position:fixed; z-index:10; color:#cfeaff;
    background:rgba(5,26,48,.74); border:1px solid rgba(96,190,255,.38);
    border-radius:10px; backdrop-filter:blur(8px);
    box-shadow:0 8px 28px rgba(0,10,25,.45); }
  /* telemetry, top-left */
  #telemetry { top:14px; left:14px; padding:10px 14px 9px; min-width:242px; }
  #telemetry .hd { font-size:10px; letter-spacing:.22em; color:#6fd3ff;
    border-bottom:1px solid rgba(96,190,255,.25); padding-bottom:6px; margin-bottom:7px;
    display:flex; justify-content:space-between; }
  #telemetry .hd .live { color:#3dff8e; }
  #telemetry .row { display:flex; justify-content:space-between; gap:18px; font-size:12.5px; line-height:1.72; }
  #telemetry .k { color:#7fa8c9; letter-spacing:.08em; }
  #telemetry .v { color:#eaf7ff; font-weight:700; }
  #telemetry .v em { font-style:normal; color:#6fd3ff; font-size:10.5px; margin-left:3px; }
  /* minimap + compass, right column */
  #rightCol { position:fixed; top:14px; right:14px; z-index:10; display:flex; flex-direction:column; gap:10px; align-items:center; }
  #rightCol .hud { position:relative; }
  #minimapBox { padding:10px 12px 8px; }
  #minimapBox .hd { font-size:10px; letter-spacing:.22em; color:#6fd3ff; margin-bottom:6px; display:flex; justify-content:space-between; }
  #minimap { display:block; width:224px; height:224px; }
  #compassBox { padding:8px 12px 6px; text-align:center; }
  #compassBox .hd { font-size:10px; letter-spacing:.22em; color:#6fd3ff; margin-bottom:2px; }
  #compass { display:block; width:158px; height:158px; }
  /* charts, bottom-left */
  #charts { left:14px; bottom:14px; padding:10px 12px 8px; display:flex; flex-direction:column; gap:7px; }
  #charts .hd { font-size:10px; letter-spacing:.18em; color:#6fd3ff; display:flex; justify-content:space-between; }
  #charts .hd b { color:#eaf7ff; }
  .chart { display:block; width:264px; height:66px; }
  /* controls, bottom-centre */
  #controls { position:fixed; z-index:10; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:7px; }
  #controls button { font:inherit; font-size:11px; letter-spacing:.06em; cursor:pointer;
    color:#cfeaff; background:rgba(5,26,48,.78); border:1px solid rgba(96,190,255,.4);
    border-radius:999px; padding:8px 14px; backdrop-filter:blur(8px); transition:all .18s; }
  #controls button:hover { border-color:#6fd3ff; color:#fff; }
  #controls button.on { background:#0e5f9e; border-color:#6fd3ff; color:#fff; }
  /* loading spinner (no text) */
  #loading { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    background:#0a2e52; transition:opacity .6s; }
  #loading.done { opacity:0; pointer-events:none; }
  #loading .spin { width:52px; height:52px; border-radius:50%;
    border:4px solid rgba(111,211,255,.25); border-top-color:#6fd3ff; animation:sp 0.9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #controls { flex-wrap:wrap; justify-content:center; max-width:96vw; }
  /* 3D annotation labels */
  #labels { position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
  .lbl { position:absolute; left:0; top:0; transform:translate(-50%,-130%); white-space:nowrap;
    font-size:10.5px; letter-spacing:.05em; color:#dff4ff; padding:4px 9px;
    background:rgba(5,26,48,.78); border:1px solid rgba(111,211,255,.55); border-radius:999px; }
  .lbl::after { content:''; position:absolute; left:50%; bottom:-14px; width:1px; height:14px;
    background:rgba(111,211,255,.55); }
  .lbl::before { content:''; position:absolute; left:50%; bottom:-19px; width:5px; height:5px; margin-left:-2.5px;
    border-radius:50%; background:#6fd3ff; }
  /* rotating science fact card */
  #factCard { right:14px; bottom:14px; width:308px; padding:11px 14px 10px; }
  #factCard .hd { font-size:10px; letter-spacing:.22em; color:#6fd3ff; margin-bottom:6px;
    display:flex; justify-content:space-between; }
  #factCard .hd .dots { color:#3d7ea6; letter-spacing:.3em; }
  #factCard .hd .dots b { color:#ffd94d; font-weight:400; }
  #factTxt { font-size:12.5px; line-height:1.55; color:#eaf7ff; min-height:58px; transition:opacity .5s; }
  @media (max-width:820px) {
    #telemetry { min-width:0; padding:8px 10px; } #telemetry .row { font-size:11px; }
    #minimap { width:148px; height:148px; } #compassBox { display:none; }
    #charts { display:none; }
    #factCard { display:none; }
    .lbl { display:none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud" id="telemetry">
  <div class="hd"><span>NAV · TELEMETRY</span><span class="live">● LIVE</span></div>
  <div class="row"><span class="k">UTC</span><span class="v" id="tUtc">--:--:--</span></div>
  <div class="row"><span class="k">LAT</span><span class="v" id="tLat">--</span></div>
  <div class="row"><span class="k">LON</span><span class="v" id="tLon">--</span></div>
  <div class="row"><span class="k">HDG</span><span class="v" id="tHdg">--</span></div>
  <div class="row"><span class="k">COG</span><span class="v" id="tCog">--</span></div>
  <div class="row"><span class="k">SOG</span><span class="v" id="tSog">--</span></div>
  <div class="row"><span class="k">WIND</span><span class="v" id="tWind">--</span></div>
  <div class="row"><span class="k">SEA</span><span class="v" id="tSea">--</span></div>
  <div class="row"><span class="k">DEPTH</span><span class="v" id="tDepth">--</span></div>
  <div class="row"><span class="k">RNG·WPT</span><span class="v" id="tRng">--</span></div>
</div>

<div id="rightCol">
  <div class="hud" id="minimapBox">
    <div class="hd"><span>TRACK</span><span>MINIMAP</span></div>
    <canvas id="minimap" width="448" height="448"></canvas>
  </div>
  <div class="hud" id="compassBox">
    <div class="hd">COMPASS · HDG / WIND</div>
    <canvas id="compass" width="316" height="316"></canvas>
  </div>
</div>

<div class="hud" id="charts">
  <div class="hd"><span>SOG · kn</span><b id="cSogV">--</b></div>
  <canvas class="chart" id="cSog" width="528" height="132"></canvas>
  <div class="hd"><span>HDG · °</span><b id="cHdgV">--</b></div>
  <canvas class="chart" id="cHdg" width="528" height="132"></canvas>
  <div class="hd"><span>WIND · kn</span><b id="cWindV">--</b></div>
  <canvas class="chart" id="cWind" width="528" height="132"></canvas>
</div>

<div id="controls">
  <button data-view="tongquan" class="on">🌐 TỔNG QUAN</button>
  <button data-view="cine">🎬 CINE</button>
  <button data-view="chase">CAM · ĐUÔI</button>
  <button data-view="bow">CAM · MŨI</button>
  <button data-view="top">CAM · TRÊN</button>
  <button data-view="orbit">CAM · TỰ DO</button>
  <button id="btnDirector">▶ TRÌNH DIỄN</button>
  <button id="btnLabels" class="on">🏷 NHÃN</button>
  <button id="btnFull">⛶ FULL</button>
  <button id="btnSail" class="on">⏸ DỪNG CHẠY</button>
</div>

<div id="labels"></div>

<div class="hud" id="factCard">
  <div class="hd"><span>KIẾN THỨC HÀNG HẢI</span><span class="dots" id="factDots"></span></div>
  <div id="factTxt"></div>
</div>

<div id="loading"><div class="spin"></div></div>

<script type="importmap">
{ "imports": { "three": "./three.module.js", "three/addons/": "./addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ renderer / scene ============ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fd2f2, 300, 860);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 2200);
camera.position.set(140, 30, 80);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
scene.add(new THREE.HemisphereLight(0xd8ecff, 0x1c4d75, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -160; sun.shadow.camera.right = 160;
sun.shadow.camera.top = 160; sun.shadow.camera.bottom = -160;
scene.add(sun); scene.add(sun.target);

/* sky dome */
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#5fa8dd'); gr.addColorStop(0.55,'#9fd2f2'); gr.addColorStop(0.78,'#d8f0fc'); gr.addColorStop(1,'#eaf7ff');
  g.fillStyle = gr; g.fillRect(0,0,4,256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 24, 16),
    new THREE.MeshBasicMaterial({ map:tex, side:THREE.BackSide, fog:false })));
}

/* ============ sea ============ */
/* wave height in world coords — shared by the mesh and the ship's motion */
function waveH(wx, wz, t) {
  return Math.sin(wx * 0.055 + t * 0.9) * 0.55 + Math.cos(wz * 0.045 - t * 0.7) * 0.5;
}
const ocean = new THREE.Mesh(
  new THREE.PlaneGeometry(1500, 1500, 110, 110),
  new THREE.MeshStandardMaterial({ color:0x1773c4, roughness:0.5, metalness:0.0, transparent:true, opacity:0.94 }));
ocean.material.envMapIntensity = 0.55;
ocean.rotation.x = -Math.PI/2; ocean.receiveShadow = true;
scene.add(ocean);
const seaPos = ocean.geometry.attributes.position;
const seaBase = seaPos.array.slice();

/* ============ route ============ */
const WPT = [
  [ 95, -45], [ 45, -88], [-45, -84], [-98, -30],
  [-84,  42], [-15,  88], [ 58,  74], [ 98,  22]
];
const curve = new THREE.CatmullRomCurve3(
  WPT.map(p => new THREE.Vector3(p[0], 0, p[1])), true, 'catmullrom', 0.6);
const routePts = curve.getPoints(360);
{
  const g = new THREE.BufferGeometry().setFromPoints(routePts.map(p => new THREE.Vector3(p.x, 0.34, p.z)));
  const route = new THREE.LineLoop(g, new THREE.LineDashedMaterial({
    color:0xd6f1ff, dashSize:3.2, gapSize:2.4, transparent:true, opacity:0.75 }));
  route.computeLineDistances();
  scene.add(route);
}
/* glowing pulses travelling along the planned route */
const pulses = [];
for (let i = 0; i < 5; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1.05, 12, 10),
    new THREE.MeshBasicMaterial({ color:0x9beaff }));
  scene.add(m); pulses.push(m);
}

/* sailed track: bright ribbon (wide, glowing) built from the trail points */
const TRAIL_MAX = 900;
const trailPts = [];
const ribbonPos = new Float32Array(TRAIL_MAX * 2 * 3);
const ribbonGeo = new THREE.BufferGeometry();
ribbonGeo.setAttribute('position', new THREE.BufferAttribute(ribbonPos, 3));
{
  const idx = [];
  for (let i = 0; i < TRAIL_MAX - 1; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  ribbonGeo.setIndex(idx);
}
const ribbon = new THREE.Mesh(ribbonGeo, new THREE.MeshBasicMaterial({
  color:0x2fd8f2, transparent:true, opacity:0.55, side:THREE.DoubleSide,
  blending:THREE.AdditiveBlending, depthWrite:false }));
ribbon.frustumCulled = false;
scene.add(ribbon);
function rebuildRibbon() {
  const n = trailPts.length, W2 = 1.5;
  for (let i = 0; i < n; i++) {
    const p = trailPts[i];
    const q = trailPts[Math.min(i + 1, n - 1)], q0 = trailPts[Math.max(i - 1, 0)];
    let dx = q.x - q0.x, dz = q.z - q0.z;
    const L = Math.hypot(dx, dz) || 1; dx /= L; dz /= L;
    const px = -dz, pz = dx;
    ribbonPos[i * 6]     = p.x - px * W2; ribbonPos[i * 6 + 1] = 0.36; ribbonPos[i * 6 + 2] = p.z - pz * W2;
    ribbonPos[i * 6 + 3] = p.x + px * W2; ribbonPos[i * 6 + 4] = 0.36; ribbonPos[i * 6 + 5] = p.z + pz * W2;
  }
  ribbonGeo.attributes.position.needsUpdate = true;
  ribbonGeo.setDrawRange(0, Math.max(0, (n - 1) * 6));
}

/* ============ scenery: buoys, island, lighthouse, distant ship ============ */
const buoys = [];
{
  const red = new THREE.MeshStandardMaterial({ color:0xd8322a, roughness:0.6 });
  const grn = new THREE.MeshStandardMaterial({ color:0x1d9e57, roughness:0.6 });
  const dark = new THREE.MeshStandardMaterial({ color:0x22282e, roughness:0.8 });
  for (let i = 0; i < 12; i++) {
    const uu = i / 12 + 0.045;
    const p = curve.getPointAt(uu), tg = curve.getTangentAt(uu);
    const side = i % 2 ? 1 : -1;
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.05, 2.2, 10), i % 2 ? grn : red);
    body.position.y = 0.6; g.add(body);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.6, 6), dark);
    top.position.y = 2.3; g.add(top);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8),
      new THREE.MeshBasicMaterial({ color: i % 2 ? 0x3dff8e : 0xff5347 }));
    lamp.position.y = 3.2; g.add(lamp);
    g.position.set(p.x - tg.z * side * 17, 0, p.z + tg.x * side * 17);
    scene.add(g); buoys.push(g);
  }
  /* island + lighthouse */
  const isl = new THREE.Group();
  const rock = new THREE.MeshStandardMaterial({ color:0x5d7263, roughness:1 });
  const m1 = new THREE.Mesh(new THREE.ConeGeometry(46, 17, 9), rock); m1.position.y = 2; isl.add(m1);
  const m2 = new THREE.Mesh(new THREE.ConeGeometry(30, 12, 8), rock); m2.position.set(30, 1, 14); isl.add(m2);
  const lh = new THREE.Group();
  const white = new THREE.MeshStandardMaterial({ color:0xf2f5f7, roughness:0.5 });
  const band = new THREE.MeshStandardMaterial({ color:0xd8322a, roughness:0.5 });
  const t1 = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.9, 15, 12), white); t1.position.y = 7.5; lh.add(t1);
  const t2 = new THREE.Mesh(new THREE.CylinderGeometry(2.45, 2.6, 3.4, 12), band); t2.position.y = 9.5; lh.add(t2);
  const lampM = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 2.4, 10),
    new THREE.MeshBasicMaterial({ color:0xffe9a3 })); lampM.position.y = 16.2; lh.add(lampM);
  lh.position.set(-8, 12, -6); isl.add(lh);
  isl.position.set(268, 0, 168);
  scene.add(isl);
  /* distant anchored ship silhouette */
  const far = new THREE.Group();
  const grey = new THREE.MeshStandardMaterial({ color:0x51606c, roughness:0.9 });
  const hullF = new THREE.Mesh(new THREE.BoxGeometry(52, 6, 9), grey); hullF.position.y = 2.5; far.add(hullF);
  const ssF = new THREE.Mesh(new THREE.BoxGeometry(9, 10, 8), grey); ssF.position.set(-18, 10, 0); far.add(ssF);
  const crF = new THREE.Mesh(new THREE.BoxGeometry(1.2, 14, 1.2), grey); crF.position.set(8, 11, 0); far.add(crF);
  far.position.set(-268, 0, -30); far.rotation.y = 0.7;
  scene.add(far);
}

/* drifting clouds + distant mountain ring on the horizon */
const clouds = [];
{
  const cm = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.82, fog:false });
  for (let i = 0; i < 11; i++) {
    const g = new THREE.Group();
    const n = 4 + Math.floor(Math.random() * 3);
    for (let j = 0; j < n; j++) {
      const r = 9 + Math.random() * 15;
      const b = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), cm);
      b.position.set(j * 13 - n * 6 + Math.random() * 6, Math.random() * 4, Math.random() * 10 - 5);
      b.scale.y = 0.38;
      g.add(b);
    }
    const a = Math.random() * Math.PI * 2, rad = 260 + Math.random() * 330;
    g.position.set(Math.cos(a) * rad, 120 + Math.random() * 70, Math.sin(a) * rad);
    scene.add(g); clouds.push(g);
  }
  const mm2 = new THREE.MeshStandardMaterial({ color:0x51708e, roughness:1 });
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2 + 0.4;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(120 + Math.random() * 90, 30 + Math.random() * 20, 7), mm2);
    cone.position.set(Math.cos(a) * 720, -4, Math.sin(a) * 720);
    scene.add(cone);
  }
}

/* ============ ship (outer: position+yaw, inner: pitch/roll from waves) ============ */
const ship = new THREE.Group();
const tilt = new THREE.Group();
ship.add(tilt); scene.add(ship);
let shipReady = false;
new GLTFLoader().load('happy-hunter-blue.glb', (gltf) => {
  const model = gltf.scene;
  model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material) o.material.envMapIntensity = 0.7; } });
  tilt.add(model);
  shipReady = true; window.__shipReady = true;
  document.getElementById('loading').classList.add('done');
}, undefined, (e) => console.error('GLB load error', e));

/* foam texture: thousands of tiny bubbles, densest at the stern, fading out */
function foamTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 1500; i++) {
    const x = Math.random() * 256, y = Math.random() * 128;
    const r = 0.8 + Math.random() * 5.2, a = 0.05 + Math.random() * 0.30;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,' + a + ')');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 600; i++) g.fillRect(Math.random() * 256, Math.random() * 128, 1.4, 1.4);
  g.globalCompositeOperation = 'destination-in';
  const lg = g.createLinearGradient(0, 0, 256, 0);
  lg.addColorStop(0, 'rgba(0,0,0,1)'); lg.addColorStop(0.7, 'rgba(0,0,0,0.6)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = lg; g.fillRect(0, 0, 256, 128);
  const vg = g.createLinearGradient(0, 0, 0, 128);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.28, 'rgba(0,0,0,1)');
  vg.addColorStop(0.72, 'rgba(0,0,0,1)'); vg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = vg; g.fillRect(0, 0, 256, 128);
  g.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 1);
  return tex;
}
const foamTex = foamTexture();
const foamMats = [];
function foamMat(opacity) {
  const m = new THREE.MeshBasicMaterial({ map:foamTex, transparent:true, opacity, depthWrite:false });
  m.userData.base = opacity;
  foamMats.push(m);
  return m;
}
function wakePlane(len, wid, op) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len, wid), foamMat(op));
  m.rotation.x = -Math.PI / 2;
  m.rotation.z = Math.PI; // texture x=0 (bright end) at the stern side
  return m;
}
const wakeC = wakePlane(64, 10, 0.95); wakeC.position.set(-26 - 32, 0.3, 0); ship.add(wakeC);
const wakeL = wakePlane(52, 5.5, 0.8); wakeL.position.set(-26 - 21, 0.3, 8.5); wakeL.rotation.z = Math.PI - 0.30; ship.add(wakeL);
const wakeR = wakePlane(52, 5.5, 0.8); wakeR.position.set(-26 - 21, 0.3, -8.5); wakeR.rotation.z = Math.PI + 0.30; ship.add(wakeR);

/* bow foam wedges + foam strips along both hull sides at the waterline */
const bowFoamL = wakePlane(15, 3.4, 0.85); bowFoamL.position.set(21.5, 0.3, 3.6); bowFoamL.rotation.z = Math.PI - 0.5; ship.add(bowFoamL);
const bowFoamR = wakePlane(15, 3.4, 0.85); bowFoamR.position.set(21.5, 0.3, -3.6); bowFoamR.rotation.z = Math.PI + 0.5; ship.add(bowFoamR);
const sideFoamL = wakePlane(38, 2.6, 0.55); sideFoamL.position.set(1, 0.28, 6.1); sideFoamL.rotation.z = Math.PI; ship.add(sideFoamL);
const sideFoamR = wakePlane(38, 2.6, 0.55); sideFoamR.position.set(1, 0.28, -6.1); sideFoamR.rotation.z = Math.PI; ship.add(sideFoamR);

/* stern wash: foam particles churned up by the propellers, drifting astern */
const WASH_N = 240;
const washPos = new Float32Array(WASH_N * 3);
const washVel = [], washAge = new Float32Array(WASH_N);

function geoOf(p) {
  return [LAT0 + (-p.z * M_PER_UNIT) / 111320,
          LON0 + ( p.x * M_PER_UNIT) / (111320 * Math.cos(LAT0 * Math.PI / 180))];
}
function fmtLat(v) { return Math.abs(v).toFixed(5) + '° ' + (v >= 0 ? 'N' : 'S'); }
function fmtLon(v) { return Math.abs(v).toFixed(5) + '° ' + (v >= 0 ? 'E' : 'W'); }
function nearestWptDist(p) {
  let best = 1e9, bi = 0;
  WPT.forEach((w, i) => { const d = Math.hypot(p.x - w[0], p.z - w[1]); if (d < best) { best = d; bi = i; } });
  return [best * M_PER_UNIT, bi + 1];
}
function sensors(t) {
  const turn = Math.abs(Math.sin(u * Math.PI * 4));
  const sog = 8.4 - turn * 1.6 + Math.sin(t * 0.35) * 0.35 + Math.sin(t * 1.7) * 0.12;
  const wind = 13.5 + Math.sin(t * 0.21 + 1.3) * 3.2 + Math.sin(t * 0.9) * 0.8;
  const windDir = (205 + Math.sin(t * 0.05) * 25 + 360) % 360;
  const depth = 21 + Math.sin(shipPos.x * 0.021) * 4.5 + Math.cos(shipPos.z * 0.017) * 3.5;
  return { sog, wind, windDir, depth };
}
function beaufort(kn) { return kn < 1 ? 0 : kn < 4 ? 1 : kn < 7 ? 2 : kn < 11 ? 3 : kn < 17 ? 4 : kn < 22 ? 5 : 6; }

const mm = document.getElementById('minimap').getContext('2d');
const MM = 448, WORLD = 150;
const mmX = x => (x + WORLD) / (2 * WORLD) * MM;
const mmY = z => (z + WORLD) / (2 * WORLD) * MM;
function drawMinimap() {
  mm.clearRect(0, 0, MM, MM);
  mm.fillStyle = 'rgba(4,24,44,0.92)'; mm.fillRect(0, 0, MM, MM);
  mm.strokeStyle = 'rgba(96,190,255,0.16)'; mm.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    mm.beginPath(); mm.moveTo(MM * i / 6, 0); mm.lineTo(MM * i / 6, MM); mm.stroke();
    mm.beginPath(); mm.moveTo(0, MM * i / 6); mm.lineTo(MM, MM * i / 6); mm.stroke();
  }
  mm.strokeStyle = 'rgba(96,190,255,0.22)';
  [50, 100, 140].forEach(r => { mm.beginPath(); mm.arc(mmX(0), mmY(0), r / (2 * WORLD) * MM, 0, Math.PI * 2); mm.stroke(); });
  mm.strokeStyle = 'rgba(160,215,255,0.45)'; mm.lineWidth = 1.6; mm.setLineDash([5, 4]);
  mm.beginPath();
  routePts.forEach((p, i) => i ? mm.lineTo(mmX(p.x), mmY(p.z)) : mm.moveTo(mmX(p.x), mmY(p.z)));
  mm.closePath(); mm.stroke(); mm.setLineDash([]);
  mm.fillStyle = '#eaf7ff';
  WPT.forEach(w => { mm.beginPath(); mm.arc(mmX(w[0]), mmY(w[1]), 3.2, 0, Math.PI * 2); mm.fill(); });
  if (trailPts.length > 1) {
    mm.strokeStyle = '#53f2ff'; mm.lineWidth = 2.6; mm.beginPath();
    trailPts.forEach((p, i) => i ? mm.lineTo(mmX(p.x), mmY(p.z)) : mm.moveTo(mmX(p.x), mmY(p.z)));
    mm.stroke();
  }
  const h = headingDeg * Math.PI / 180;
  const sx = mmX(shipPos.x), sy = mmY(shipPos.z);
  /* COG vector predictor (ECDIS style) */
  mm.strokeStyle = 'rgba(61,255,142,0.85)'; mm.lineWidth = 2; mm.setLineDash([6, 4]);
  mm.beginPath(); mm.moveTo(sx, sy);
  mm.lineTo(sx + Math.sin(h) * 34, sy - Math.cos(h) * 34); mm.stroke(); mm.setLineDash([]);
  const dx = Math.sin(h), dy = -Math.cos(h);
  mm.save(); mm.translate(sx, sy); mm.rotate(Math.atan2(dx, -dy));
  mm.fillStyle = '#ffd94d';
  mm.beginPath(); mm.moveTo(0, -9); mm.lineTo(5.5, 7); mm.lineTo(-5.5, 7); mm.closePath(); mm.fill();
  mm.restore();
  mm.strokeStyle = 'rgba(255,217,77,0.5)'; mm.lineWidth = 1.4;
  mm.beginPath(); mm.arc(sx, sy, 13, 0, Math.PI * 2); mm.stroke();
  mm.fillStyle = '#6fd3ff'; mm.font = 'bold 17px monospace'; mm.fillText('N', MM - 26, 24);
  mm.beginPath(); mm.moveTo(MM - 21, 30); mm.lineTo(MM - 16, 42); mm.lineTo(MM - 26, 42); mm.closePath(); mm.fill();
  mm.fillStyle = 'rgba(207,234,255,0.75)'; mm.font = '12px monospace';

const cp = document.getElementById('compass').getContext('2d');
function drawCompass(windDir) {
  const C = 158, R = 148, cx = C, cy = C;
  cp.clearRect(0, 0, 316, 316);
  cp.fillStyle = 'rgba(4,24,44,0.92)';
  cp.beginPath(); cp.arc(cx, cy, C - 2, 0, Math.PI * 2); cp.fill();
  cp.strokeStyle = 'rgba(96,190,255,0.5)'; cp.lineWidth = 2;
  cp.beginPath(); cp.arc(cx, cy, C - 3, 0, Math.PI * 2); cp.stroke();
  for (let d = 0; d < 360; d += 10) {
    const a = d * Math.PI / 180, big = d % 30 === 0;
    const r1 = R - (big ? 16 : 9);
    cp.strokeStyle = 'rgba(160,215,255,0.55)'; cp.lineWidth = big ? 2.4 : 1.2;
    cp.beginPath();
    cp.moveTo(cx + Math.sin(a) * r1, cy - Math.cos(a) * r1);
    cp.lineTo(cx + Math.sin(a) * R, cy - Math.cos(a) * R);
    cp.stroke();
  }
  cp.font = 'bold 21px monospace'; cp.textAlign = 'center'; cp.textBaseline = 'middle';
  cp.fillStyle = '#ff5347'; cp.fillText('N', cx, cy - R + 32);
  cp.fillStyle = '#cfeaff';
  cp.fillText('E', cx + R - 32, cy); cp.fillText('S', cx, cy + R - 32); cp.fillText('W', cx - R + 32, cy);
  /* wind arrow (points where wind blows FROM, cyan) */
  const wa = windDir * Math.PI / 180;
  cp.strokeStyle = '#53f2ff'; cp.lineWidth = 3.4;
  cp.beginPath();
  cp.moveTo(cx + Math.sin(wa) * (R - 40), cy - Math.cos(wa) * (R - 40));
  cp.lineTo(cx + Math.sin(wa) * (R - 74), cy - Math.cos(wa) * (R - 74));
  cp.stroke();
  cp.fillStyle = '#53f2ff';
  cp.save(); cp.translate(cx + Math.sin(wa) * (R - 74), cy - Math.cos(wa) * (R - 74)); cp.rotate(wa + Math.PI);
  cp.beginPath(); cp.moveTo(0, -8); cp.lineTo(5, 5); cp.lineTo(-5, 5); cp.closePath(); cp.fill(); cp.restore();
  /* heading needle */
  const h = headingDeg * Math.PI / 180;
  cp.fillStyle = '#ffd94d';
  cp.save(); cp.translate(cx, cy); cp.rotate(h);
  cp.beginPath(); cp.moveTo(0, -R + 44); cp.lineTo(8, 14); cp.lineTo(-8, 14); cp.closePath(); cp.fill();
  cp.restore();
  cp.fillStyle = 'rgba(5,26,48,0.9)';
  cp.beginPath(); cp.arc(cx, cy, 40, 0, Math.PI * 2); cp.fill();
  cp.strokeStyle = 'rgba(96,190,255,0.4)'; cp.lineWidth = 1.4;
  cp.beginPath(); cp.arc(cx, cy, 40, 0, Math.PI * 2); cp.stroke();
  cp.fillStyle = '#eaf7ff'; cp.font = 'bold 25px monospace';
  cp.fillText(headingDeg.toFixed(0) + '°', cx, cy - 4);
  cp.fillStyle = '#7fa8c9'; cp.font = '13px monospace';
  cp.fillText('HDG', cx, cy + 20);
  cp.textAlign = 'left'; cp.textBaseline = 'alphabetic';
}

function drawChart(ch, min, max, color, fill) {
  const { ctx, data } = ch, W = 528, H = 132;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(4,24,44,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(96,190,255,0.18)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0, H * i / 4); ctx.lineTo(W, H * i / 4); ctx.stroke(); }
  for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(W * i / 6, 0); ctx.lineTo(W * i / 6, H); ctx.stroke(); }
  ctx.fillStyle = 'rgba(127,168,201,0.9)'; ctx.font = '14px monospace';
  ctx.fillText(max.toFixed(0), 6, 16); ctx.fillText(min.toFixed(0), 6, H - 5);
  if (data.length < 2) return;
  /* filled area under the line — modern look */
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = i / 109 * W, y = H - (v - min) / (max - min) * (H - 12) - 6;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.lineTo((data.length - 1) / 109 * W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

/* ============ main loop ============ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = (performance.now() - t0) / 1000;

  /* sea surface (local plane coords: world z = -local y) */
  const pos = ocean.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const lx = seaBase[i * 3], ly = seaBase[i * 3 + 1];
    pos.array[i * 3 + 2] = waveH(lx, -ly, t);
  }
  pos.needsUpdate = true;
  ocean.geometry.computeVertexNormals();

  /* buoys ride the waves */
  for (const b of buoys) {
    b.position.y = waveH(b.position.x, b.position.z, t) * 0.8 - 0.2;
    b.rotation.x = Math.sin(t * 0.8 + b.position.x) * 0.05;
    b.rotation.z = Math.cos(t * 0.7 + b.position.z) * 0.05;
  }

  /* route pulses advance */
  pulses.forEach((m, i) => {
    const uu = (t * 0.012 + i / pulses.length) % 1;
    const p = curve.getPointAt(uu);
    m.position.set(p.x, 1.1 + Math.sin(t * 2 + i) * 0.25, p.z);
  });

  if (shipReady) {
    prevPos.copy(shipPos);
    if (sailing) u = (u + dt / LOOP_SEC) % 1;
    const p = curve.getPointAt(u);
    const tan = curve.getTangentAt(u);
    shipPos.set(p.x, 0, p.z);
    headingDeg = (Math.atan2(tan.x, tan.z) * 180 / Math.PI + 360) % 360;
    const yaw = Math.atan2(-tan.z, tan.x);
    /* heave/pitch/roll sampled from the real wave field */
    const hC = waveH(shipPos.x, shipPos.z, t);
    const fx = Math.cos(yaw), fz = -Math.sin(yaw);        // bow direction in world (model +X after yaw)
    const hB = waveH(shipPos.x + fx * 20, shipPos.z + fz * 20, t);
    const hS = waveH(shipPos.x - fx * 20, shipPos.z - fz * 20, t);
    const hP = waveH(shipPos.x - fz * 6, shipPos.z + fx * 6, t);
    const hT = waveH(shipPos.x + fz * 6, shipPos.z - fx * 6, t);
    ship.position.set(shipPos.x, hC * 0.82 + 0.1, shipPos.z);
    ship.rotation.y = yaw;
    tilt.rotation.z = Math.atan2(hB - hS, 40) * 0.9;      // pitch (bow up/down with the swell)
    tilt.rotation.x = Math.atan2(hP - hT, 12) * 0.7;      // roll

    /* foam + spray only while under way; foam texture churns/scrolls */
    foamFade += ((sailing ? 1 : 0) - foamFade) * 0.04;
    for (const m of foamMats) m.opacity = m.userData.base * foamFade;
    foamTex.offset.x -= dt * 0.16;
    foamTex.offset.y = Math.sin(t * 0.7) * 0.012;
    if (sailing) {
      for (let i = 0; i < WASH_N; i++) {
        washAge[i] += dt;
        if (washAge[i] > 3 || washPos[i * 3] < -105) { respawnWash(i); continue; }
        washPos[i * 3] += washVel[i].x * dt;
        washPos[i * 3 + 2] += washVel[i].z * dt;
        washPos[i * 3 + 1] = 0.34 + Math.sin(t * 2 + i) * 0.05;
      }
      washGeo.attributes.position.needsUpdate = true;
    }
    if (wash) wash.material.opacity = 0.85 * foamFade;
    if (sailing) {
      for (let i = 0; i < SPRAY_N; i++) {
        if (sprayPos[i * 3 + 1] < 0) { if (Math.random() < 0.25) respawnSpray(i); continue; }
        sprayVel[i].y -= 5.5 * dt;
        sprayPos[i * 3] += sprayVel[i].x * dt;
        sprayPos[i * 3 + 1] += sprayVel[i].y * dt;
        sprayPos[i * 3 + 2] += sprayVel[i].z * dt;
      }
      sprayGeo.attributes.position.needsUpdate = true;
    }

    /* trail recording */
    if (sailing && t - lastTrail > 0.35) {
      lastTrail = t;
      trailPts.push(new THREE.Vector3(shipPos.x, 0.36, shipPos.z));
      if (trailPts.length > TRAIL_MAX) trailPts.shift();
      rebuildRibbon();
    }

    /* exhibition director: advance the shot list */
    if (director) {
      dirTime += dt;
      if (dirTime > DIR_SEQ[dirIdx][1]) {
        dirTime = 0;
        dirIdx = (dirIdx + 1) % DIR_SEQ.length;
        setCamMode(DIR_SEQ[dirIdx][0]);
      }
    }
    /* clouds drift */
    for (const c of clouds) { c.position.x += dt * 1.1; if (c.position.x > 640) c.position.x = -640; }

    /* camera */
    const overview = camMode === 'tongquan';
    if (firstFrame) {
      const d0 = camDesired(t);
      if (d0) camera.position.copy(d0);
      firstFrame = false;
    } else if (camMode === 'orbit') {
      camera.position.add(shipPos.clone().sub(prevPos));
    } else {
      const want = camDesired(t);
      if (want) camera.position.lerp(want, camMode === 'cine' ? 0.028 : overview ? 0.03 : 0.05);
    }
    const targetWanted = overview ? new THREE.Vector3(0, 2, 0)
      : new THREE.Vector3(shipPos.x, shipPos.y + 3.2, shipPos.z);
    controls.target.lerp(targetWanted, overview ? 0.04 : 1);
    const sunAnchor = overview ? new THREE.Vector3(0, 0, 0) : shipPos;
    sun.position.set(sunAnchor.x + 90, 130, sunAnchor.z + 50);
    sun.target.position.copy(sunAnchor);

    if (t - lastHud > 0.15) { lastHud = t; updateHud(t); drawMinimap(); }
    if (t - lastChart > 0.45) {
      lastChart = t;
      chSog.push(sogKn); chHdg.push(headingDeg); chWind.push(windNow);
      drawChart(chSog, 4, 12, '#53f2ff', 'rgba(83,242,255,0.13)');
      drawChart(chHdg, 0, 360, '#ffd94d', 'rgba(255,217,77,0.13)');
      drawChart(chWind, 4, 24, '#3dff8e', 'rgba(61,255,142,0.13)');
    }
  }
  controls.update();
  if (shipReady && !LABELS.length) initLabels();
  updateLabels();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
